<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Giulio Boscaro</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #8a8a8a; --line: #ececec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --fg: #ededed; --muted: #7a7a7a; --line: #222222; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 400 15px/1.6 Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 640px; width: 100%; padding: 24px; }
    h1 { margin: 0; font-size: 15px; font-weight: 500; }
    p { margin: 0; color: var(--muted); }
    .note { margin-top: 32px; color: var(--fg); }
    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
      transition: text-decoration-color .2s;
    }
    a:hover { text-decoration-color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Giulio Boscaro</h1>
    <p>Digital advertising</p>
    <p class="note">Il sito è in costruzione.</p>
    <p>Per contatti: <a href="mailto:giulio@swotstudios.com">giulio@swotstudios.com</a></p>
  </main>
</body>
</html>
